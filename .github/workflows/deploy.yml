name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      # Force Pages source to GitHub Actions even if it was previously enabled in
      # "branch" mode. configure-pages@v5 with enablement:true only enables when
      # absent and does NOT reconfigure an existing site. We do it ourselves.
      - name: Switch Pages build type to workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Try update first; if 404 (Pages not enabled yet) create it.
          if ! gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow ; then
            echo "PUT failed, trying POST to create Pages site with workflow build type"
            gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
