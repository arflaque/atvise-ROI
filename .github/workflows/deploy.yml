name: CI build

# This repo is currently served by GitHub Pages in "Deploy from branch" mode
# (legacy build_type) — the workflow that actually publishes the site is the
# built-in "pages build and deployment" job, which simply serves repo root.
# We keep this workflow as a build-only sanity check: it verifies that a
# fresh clone passes TypeScript + Vite build. No deploy steps here, so it
# never fails on Pages permissions.
#
# When/if Pages is later switched to "GitHub Actions" source, restore the
# previous deploy steps from git history (commit 5cd4bee).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build
